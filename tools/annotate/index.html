<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>临写 · 标注</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#141414; color:#eee; font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:9px 16px; background:#222; border-bottom:1px solid #333; flex-shrink:0; }
  h1 { font-size:15px; margin:0; letter-spacing:1px; }
  .hint { color:#8fd; font-size:12.5px; }
  .stat { margin-left:auto; color:#aaa; font-variant-numeric:tabular-nums; }
  main { flex:1; display:flex; min-height:0; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; padding:10px; gap:8px; }
  #videoWrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; background:#000; border-radius:8px; overflow:hidden; position:relative; }
  video { max-width:100%; max-height:100%; display:block; }
  #markers { position:absolute; inset:0; pointer-events:none; }
  .corner { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:#ffd400; border:2px solid #000; }
  #timebar { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #seek { flex:1; }
  #tnow { font-variant-numeric:tabular-nums; color:#ffd; min-width:60px; text-align:right; }
  button { background:#333; color:#eee; border:1px solid #444; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { background:#3d3d3d; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:#e0533d; border-color:#e0533d; }
  aside { width:360px; background:#222; border-left:1px solid #333; display:flex; flex-direction:column; flex-shrink:0; }
  aside h2 { font-size:12px; margin:0; padding:8px 14px; border-bottom:1px solid #333; color:#999; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
  aside h2 span { margin-left:auto; color:#7fd67f; font-variant-numeric:tabular-nums; }
  #cropBox { padding:12px; border-bottom:1px solid #333; }
  #cropPreview { width:100%; aspect-ratio:1; background:#000; border-radius:6px; display:block; }
  #cropLabel { color:#888; font-size:12px; margin-top:6px; text-align:center; }
  #cropActions { display:flex; gap:8px; margin-top:8px; }
  #cropActions button { flex:1; }
  #chars { flex:1; overflow:auto; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; }
  .ch { width:56px; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
        background:#2a2a2a; border:1px solid #3a3a3a; border-radius:6px; cursor:pointer; font-size:23px; line-height:1; }
  .ch small { font-size:9px; color:#888; margin-top:2px; font-variant-numeric:tabular-nums; }
  .ch:hover { background:#353535; }
  .ch.done { background:#1e3a24; border-color:#2f6b3f; }
  .ch.done small { color:#7fd67f; }
  .ch.next { box-shadow:0 0 0 2px #ffd400; }
  footer { border-top:1px solid #333; padding:9px 14px; display:flex; gap:8px; align-items:center; background:#222; }
  select { background:#333; color:#eee; border:1px solid #444; border-radius:6px; padding:5px 8px; font-size:13px; }
  #status { margin-left:auto; font-size:12px; color:#7fd67f; min-width:120px; text-align:right; }
</style>
</head>
<body>
<header>
  <h1>标注</h1>
  <span class="hint">右侧点四角定裁切框；播放时点字块记录起笔时刻（空格＝下一个）</span>
  <span class="stat" id="progress"></span>
</header>
<main>
  <div id="left">
    <div id="videoWrap">
      <video id="v" preload="auto" muted playsinline></video>
      <div id="markers"></div>
    </div>
    <div id="timebar">
      <button id="play">▶</button>
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
      <span id="tnow">0.0s</span>
      <button id="back">-2s</button>
      <button id="fwd">+2s</button>
      <button id="rate">1×</button>
    </div>
  </div>
  <aside>
    <h2>裁切框 <span id="cropState"></span></h2>
    <div id="cropBox">
      <canvas id="cropPreview" width="300" height="300"></canvas>
      <div id="cropLabel">尚未标定</div>
      <div id="cropActions">
        <button id="resetCrop">重标</button>
      </div>
    </div>
    <h2>汉字 <span id="markCount"></span></h2>
    <div id="chars"></div>
  </aside>
</main>
<footer>
  <select id="ep"></select>
  <button id="whole">整集播放</button>
  <button id="undo">撤销上一个</button>
  <button id="clear">清空本集</button>
  <span id="status"></span>
</footer>

<script>
const v = document.getElementById("v");
const seek = document.getElementById("seek");
const tnow = document.getElementById("tnow");
const listEl = document.getElementById("chars");
const canvas = document.getElementById("cropPreview");
const ctx = canvas.getContext("2d");
const markers = document.getElementById("markers");

let episodes = [], cur = null, pending = [];
let corners = [];   // crop corners being placed, in %

const fmt = s => {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, "0")}`;
};
const flash = text => {
  const el = document.getElementById("status");
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 1600);
};

async function boot() {
  episodes = await (await fetch("/api/state")).json();
  const sel = document.getElementById("ep");
  for (const p of episodes) {
    const o = document.createElement("option");
    o.value = String(p.page);
    o.textContent = `P${String(p.page).padStart(3, "0")} · ${p.chars.length} 字`;
    sel.appendChild(o);
  }
  sel.onchange = () => open(Number(sel.value));
  open(episodes[0].page);
}

function open(page) {
  cur = episodes.find(p => p.page === page);
  corners = [];
  markers.innerHTML = "";
  v.src = `/stream/${page}`;
  v.load();
  document.getElementById("ep").value = String(page);
  render();
  drawCrop();
}

function render() {
  const marked = cur.chars.filter(c => cur.marks[c]).length;
  document.getElementById("progress").textContent = `P${String(cur.page).padStart(3, "0")}`;
  document.getElementById("markCount").textContent = `${marked} / ${cur.chars.length}`;
  document.getElementById("cropState").textContent = cur.crop ? "已标定" : "未标定";
  listEl.innerHTML = "";
  let first = false;
  for (const ch of cur.chars) {
    const mark = cur.marks[ch];
    const el = document.createElement("div");
    el.className = "ch" + (mark ? " done" : "");
    if (!mark && !first) { el.classList.add("next"); first = true; }
    el.innerHTML = `${ch}<small>${mark ? (mark.whole ? "整集" : fmt(mark.start)) : "—"}</small>`;
    el.onclick = () => setMark(ch);
    listEl.appendChild(el);
  }
}

function setMark(char) {
  const page = cur;
  if (!page.crop) return flash("先标定裁切框");
  const start = +v.currentTime.toFixed(1);
  const index = page.chars.indexOf(char);
  const next = page.chars.slice(index + 1).map(c => page.marks[c]?.start).find(s => s > start);
  const end = Math.max(next ?? Math.min(page.duration, start + 20), start + 1);
  page.marks[char] = { start, end };
  render();
  persist({ char, start, end });
}

async function persist({ char, start, end }) {
  const body = {
    page: cur.page,
    crop: cur.crop,
    marks: char
      ? [{ char, start, end }]
      : cur.chars.filter(c => cur.marks[c]).map(c => ({ char: c, ...cur.marks[c] })),
  };
  const res = await fetch("/api/save", { method: "POST", body: JSON.stringify(body) });
  flash(res.ok ? "已保存" : "保存失败");
}

// --- 裁切框：点四个角 ---
function pct(e) {
  const r = v.getBoundingClientRect();
  return {
    x: Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)),
    y: Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)),
  };
}

v.addEventListener("click", e => {
  const p = pct(e);
  corners.push(p);
  const dot = document.createElement("div");
  dot.className = "corner";
  dot.style.left = p.x + "%";
  dot.style.top = p.y + "%";
  markers.appendChild(dot);
  if (corners.length < 4) return;
  const xs = corners.map(c => c.x), ys = corners.map(c => c.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = v.videoWidth, H = v.videoHeight;
  // half is a percentage of frame height: take the tighter axis so the square stays inside.
  const halfPx = Math.min((x1 - x0) / 100 * W, (y1 - y0) / 100 * H) / 2;
  cur.crop = {
    cx: +((x0 + x1) / 2).toFixed(1),
    cy: +((y0 + y1) / 2).toFixed(1),
    half: +(halfPx / H * 100).toFixed(1),
  };
  corners = [];
  markers.innerHTML = "";
  drawCrop();
  render();
  persist({});
});

document.getElementById("resetCrop").onclick = () => {
  corners = [];
  markers.innerHTML = "";
  drawCrop();
};

function drawCrop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 300, 300);
  const label = document.getElementById("cropLabel");
  if (!cur?.crop || !v.videoWidth) {
    label.textContent = cur?.crop ? "预览就绪后显示" : "点画面四个角标定";
    return;
  }
  const { cx, cy, half } = cur.crop;
  const W = v.videoWidth, H = v.videoHeight;
  const sidePx = half / 100 * H * 2;
  const x = (cx / 100) * W - sidePx / 2;
  const y = (cy / 100) * H - sidePx / 2;
  ctx.drawImage(v, x, y, sidePx, sidePx, 0, 0, 300, 300);
  label.textContent = `中心 ${cx}%, ${cy}%　边长 ${(half * 2).toFixed(1)}%`;
}

// --- 播放控制 ---
let lastDraw = 0;
v.addEventListener("timeupdate", () => {
  const d = v.duration || 0;
  seek.value = d ? v.currentTime / d * 100 : 0;
  tnow.textContent = `${v.currentTime.toFixed(1)}s`;
  // The preview must follow the frame, otherwise it shows whatever was on screen at load.
  const now = performance.now();
  if (now - lastDraw > 250) { lastDraw = now; drawCrop(); }
});
v.addEventListener("loadedmetadata", () => drawCrop());
seek.oninput = () => { if (v.duration) v.currentTime = v.duration * seek.value / 100; };
document.getElementById("play").onclick = () => v.paused ? v.play() : v.pause();
document.getElementById("back").onclick = () => { v.currentTime = Math.max(0, v.currentTime - 2); };
document.getElementById("fwd").onclick = () => { v.currentTime = Math.min(v.duration || 0, v.currentTime + 2); };
const rates = [1, 0.75, 0.5];
let ri = 0;
document.getElementById("rate").onclick = () => {
  ri = (ri + 1) % rates.length;
  v.playbackRate = rates[ri];
  document.getElementById("rate").textContent = rates[ri] + "×";
};

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    const next = cur.chars.find(c => !cur.marks[c]);
    if (next) setMark(next);
  }
  if (e.code === "ArrowLeft") { e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 2); }
  if (e.code === "ArrowRight") { e.preventDefault(); v.currentTime = Math.min(v.duration || 0, v.currentTime + 2); }
});

document.getElementById("undo").onclick = () => {
  const last = cur.chars.filter(c => cur.marks[c]).pop();
  if (!last) return;
  delete cur.marks[last];
  render();
  persist({});
};

document.getElementById("clear").onclick = () => {
  cur.marks = {};
  render();
  persist({});
};

document.getElementById("whole").onclick = () => {
  if (!cur.crop) return flash("先标定裁切框");
  cur.marks = Object.fromEntries(cur.chars.map(c => [c, { start: 0, end: cur.duration, whole: true }]));
  render();
  fetch("/api/save", {
    method: "POST",
    body: JSON.stringify({ page: cur.page, crop: cur.crop, whole: true, marks: cur.chars.map(c => ({ char: c, start: 0, end: cur.duration })) }),
  }).then(r => flash(r.ok ? "已设为整集播放" : "保存失败"));
};

boot();
</script>
</body>
</html>
