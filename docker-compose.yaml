# 部署示例：先准备 data/fonts，再运行
# docker compose -f docker-compose.yaml up -d --wait
# 示范视频数据已打进镜像；如需换成更新的版本，取消 volumes 里的注释并指向宿主机文件。
name: linxie

services:
  app:
    image: ghcr.io/oner8/linxie:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      TRUST_PROXY: "1"
      BILIBILI_SESSDATA: ${BILIBILI_SESSDATA:-}
    volumes:
      # - ${LINXIE_VIDEO_DATA:-./data/videos.json}:/app/data/videos.json:ro,Z
      - ${LINXIE_FONT_DIR:-./data/fonts}:/app/data/fonts:ro,Z
      - ${LINXIE_CACHE_DIR:-./data/cache}:/app/data/cache:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
