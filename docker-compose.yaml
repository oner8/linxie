# Docker 部署示例：先准备 data/fonts，再运行
# docker compose -f docker-compose.yaml up -d --wait
name: linxie

services:
  app:
    image: ghcr.io/oner8/linxie:0.1.2
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      TRUST_PROXY: "1"
    volumes:
      - ./data/fonts:/app/data/fonts:ro,Z
      - ./data/cache:/app/data/cache:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
