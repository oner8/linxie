name: linxie

services:
  app:
    image: ${LINXIE_IMAGE:-linxie:0.1.4}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${LINXIE_PORT:-3100}:3000"
    environment:
      TRUST_PROXY: "1"
      # Optional: raises the demonstration-video quality ceiling above 480p.
      BILIBILI_SESSDATA: ${BILIBILI_SESSDATA:-}
      # Set to serve pre-cut clips from your own host; empty proxies Bilibili instead.
      LINXIE_CLIPS_BASE: ${LINXIE_CLIPS_BASE:-}
    volumes:
      # Optional: a newer data file than the one baked into the image.
      # - ${LINXIE_VIDEO_DATA:-./data/videos.json}:/app/data/videos.json:ro,Z
      - ${LINXIE_FONT_DIR:-./data/fonts}:/app/data/fonts:ro,Z
      - ${LINXIE_CACHE_DIR:-./data/cache}:/app/data/cache:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
